<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifestyle Canvas Media</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        body {
            background-color: #FFFFFF;
            color: #333333;
            font-family: 'Libre Caslon Text', serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Ensures centering on desktop and eliminates mobile scroll */
            height: 100vh;
            height: 100dvh; 
            margin: 0;
            text-align: center;
            padding: 20px;
            overflow: hidden;
            box-sizing: border-box;
        }
        h1 {
            font-size: 3rem;
            font-weight: 700; 
            letter-spacing: -0.01em;
            margin-bottom: 1.5rem;
        }
        .status {
            font-style: italic;
            font-size: 1.1rem;
            opacity: 0.8;
            letter-spacing: 0.02em;
            margin: 4px 0;
        }
    </style>
</head>
<body>
    <h1>Lifestyle Canvas Media</h1>
    <p class="status">Website under development</p>
    <p class="status">Arriving Spring 2026</p>
</body>
</html>
