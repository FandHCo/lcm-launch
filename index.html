<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifestyle Canvas Media</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #FFFFFF;
            color: #333333;
            font-family: 'Libre Caslon Text', serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 40px;
            box-sizing: border-box;
        }
        .container {
            max-width: 600px;
        }
        h1 {
            font-size: 2.5rem; /* Slightly smaller to prevent distortion */
            font-weight: 700; 
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            line-height: 1.2;
        }
        .status {
            font-style: italic;
            font-size: 1.05rem;
            opacity: 0.7;
            letter-spacing: 0.01em;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lifestyle Canvas Media</h1>
        <p class="status">Website under development</p>
        <p class="status">Arriving Spring 2026</p>
    </div>
</body>
</html>
